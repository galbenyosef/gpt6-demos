name: Temblor desktop
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  desktop:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: temblor
    env:
      ARCHIVE: temblor-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.100.0
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers xvfb xauth
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets
      - run: cargo build --locked --release -p temblor-desktop
      - name: Package and verify executable, embedded PK3s and notices
        run: python3 scripts/package-desktop.py "$GITHUB_REF_NAME"
      - name: Launch the extracted game outside the checkout
        run: |
          archive="$PWD/target/dist/$ARCHIVE.tar.gz"
          directory="$(mktemp -d)"
          cd "$directory"
          tar -xzf "$archive"
          if [ "$RUNNER_OS" = Linux ]; then
            export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
            export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
            xvfb-run -a "./$ARCHIVE/temblor-desktop" --check-bundle
          else
            "./$ARCHIVE/temblor-desktop" --check-bundle
          fi
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ env.ARCHIVE }}
          path: temblor/target/dist/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Link the download
        env:
          DOWNLOAD: ${{ steps.upload.outputs.artifact-url }}
        run: echo "[Download $ARCHIVE]($DOWNLOAD)" >> "$GITHUB_STEP_SUMMARY"
