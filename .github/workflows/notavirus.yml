name: NotAVirus
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: not-a-virus
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/gnome/protocol.test.mjs
      - run: ./scripts/build-gnome.sh
      - run: python3 tests/gnome/process-test.py
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: not-a-virus
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --locked -p notavirus-core -p notavirus-pack
      - run: ./scripts/bundle.sh
