schema = 1
id = "default"
name = "Paco (Default)"
author = "NotAVirus — AI-assisted original animation; provenance in art/paco/"
version = 2
tile = [128, 128]
anchor = [64, 116]
filter = "nearest"

[atlas]
file = "atlas.png"
grid = [4, 4]

[behavior]
preset = "chase"
idle = "sit_and_wipe"
moving = "huffing_run"
start_moving = "stand_up"
stop_moving = "sit_down"
turn = "turn_around"
sleep = "doze"
idle_delay_ms = 250
sleep_after_ms = 12000

[motion]
max_speed = 180
acceleration = 500
stop_distance = 24
start_distance = 40

[states.sit_and_wipe]
frames = [0, 1, 2, 3, 0]
durations_ms = [1400, 150, 280, 150, 400]
loop = true

[states.huffing_run]
frames = [4, 5, 6, 7]
fps = 10
loop = true
flip = "velocity"

[states.stand_up]
frames = [8, 9, 10, 11]
durations_ms = [80, 160, 160, 100]
loop = false
interrupt = "finish"

[states.sit_down]
frames = [11, 10, 9, 8]
durations_ms = [80, 100, 120, 160]
loop = false
interrupt = "on_move"

[states.turn_around]
frames = [12, 13]
fps = 12
loop = false
interrupt = "finish"

[states.doze]
frames = [14, 15]
durations_ms = [850, 1150]
loop = true
