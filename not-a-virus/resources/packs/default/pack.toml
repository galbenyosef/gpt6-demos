schema = 1
id = "default"
name = "gatita (Default)"
author = "NotAVirus — original AI-assisted artwork; see art/gatita/"
version = 3
tile = [128, 128]
anchor = [64, 116]
filter = "linear"
[atlas]
file = "atlas.png"
grid = [4, 6]

[behavior]
preset = "chase"
idle = "play_roll_purr"
moving = "bound"
start_moving = "crouch"
stop_moving = "settle"
sleep = "curl_up_asleep"
wake = "stretch"
idle_delay_ms = 180
sleep_after_ms = 18000
[motion]
max_speed = 420
acceleration = 1600
stop_distance = 18
start_distance = 32

# Quiet holds frame the playful roll. Idle remains immediately interruptible.
[states.play_roll_purr]
frames = [0, 1, 2, 3, 4, 5, 6, 7, 6, 7, 5, 23, 0]
durations_ms = [900, 240, 160, 280, 180, 240, 650, 650, 650, 650, 220, 260, 400]
loop = true
[states.bound]
frames = [8, 9, 10, 11]
fps = 14
[states.crouch]
frames = [12, 13]
durations_ms = [60, 100]
loop = false
[states.settle]
frames = [14, 15]
durations_ms = [80, 160]
loop = false
interrupt = "finish"
next = "tail_flick"
[states.tail_flick]
frames = [16, 17]
durations_ms = [120, 160]
loop = false
interrupt = "on_move"
[states.curl_up_asleep]
frames = [18, 19]
durations_ms = [1100, 1300]
[states.stretch]
frames = [20, 21, 22]
durations_ms = [120, 260, 120]
loop = false
