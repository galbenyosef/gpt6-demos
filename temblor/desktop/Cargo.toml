[package]
name = "temblor-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Native desktop host for Temblor"

[dependencies]
temblor = { path = "..", features = ["native-renderer"] }
egui = "0.31"
egui-wgpu = { version = "0.31", default-features = false }
egui-winit = { version = "0.31", default-features = false, features = ["x11", "wayland"] }
winit = "0.30"
wgpu = { version = "24", default-features = false, features = ["wgsl", "metal"] }
pollster = "0.4"
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
serde_json = "1"
